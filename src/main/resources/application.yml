spring:
  application:
    name: building-manager-network
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
springdoc:
  default-produces-media-type: application/json

server:
  error:
    include-message: always
    include-binding-errors: always

payment:
  gateway:
    default: stripe
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    viva:
      merchant-id: ${VIVA_MERCHANT_ID:placeholder}
      api-key: ${VIVA_API_KEY:placeholder}

logging:
  level:
    com.buildingmanager: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
