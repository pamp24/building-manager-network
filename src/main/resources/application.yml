spring:
  application:
    name: building-manager-network
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
springdoc:
  default-produces-media-type: application/json

contact:
  admin-email: ${CONTACT_ADMIN_EMAIL:}
  sender-email: ${CONTACT_SENDER_EMAIL:}

# Business VAT defaults to 24% and must be reviewed for the applicable tax rules.
# Individual plan prices include VAT; business plan prices exclude VAT.
pricing:
  annual-discount-basis-points: ${PRICING_ANNUAL_DISCOUNT_BASIS_POINTS:1500}
  business-vat-basis-points: ${PRICING_BUSINESS_VAT_BASIS_POINTS:2400}
  individual-plus-monthly-cents: ${PRICING_INDIVIDUAL_PLUS_MONTHLY_CENTS:990}
  individual-plus-extra-apartment-cents: ${PRICING_INDIVIDUAL_PLUS_EXTRA_APARTMENT_CENTS:100}
  business-starter-monthly-cents: ${PRICING_BUSINESS_STARTER_MONTHLY_CENTS:2990}
  business-growth-monthly-cents: ${PRICING_BUSINESS_GROWTH_MONTHLY_CENTS:7990}

server:
  error:
    include-message: always
    include-binding-errors: always

payment:
  gateway:
    default: stripe
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    viva:
      merchant-id: ${VIVA_MERCHANT_ID:placeholder}
      api-key: ${VIVA_API_KEY:placeholder}

logging:
  level:
    com.buildingmanager: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
