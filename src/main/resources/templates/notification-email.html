<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oikio - Ειδοποίηση</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f3f6f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f3f6f5;">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background-color:#ffffff;">
                <tr><td style="padding:24px 28px;background-color:#174d43;color:#ffffff;font-size:24px;font-weight:bold;">Oikio</td></tr>
                <tr>
                    <td style="padding:32px 28px;">
                        <!-- Header -->
                        <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td>
                                    <h1 style="margin: 0; color: #203531; font-size: 22px;">Ειδοποίηση</h1>
                                </td>
                                <td align="right" th:if="${buildingName}" style="color: #555; font-size: 13px;">
                                    <strong th:text="${buildingName}">Πολυκατοικία</strong>
                                </td>
                            </tr>
                        </table>
                        <hr style="border: 0; border-top: 2px solid #dce9e5; margin: 18px 0;">

                        <!-- Greeting -->
                        <p style="font-size: 16px; color: #555;" th:text="'Γεια σας ' + ${username} + ','">Γεια σας,</p>

                        <!-- Message -->
                        <p style="font-size: 16px; color: #333; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere;" th:text="${message}">Μήνυμα ειδοποίησης</p>

                        <!-- Building details box -->
                        <table width="100%" cellpadding="12" cellspacing="0" th:if="${buildingName != null or managerName != null or buildingAddress != null or apartmentLabel != null}"
                               style="background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; margin: 22px 0;">
                            <tr>
                                <td style="font-size: 14px; color: #555;">
                                    <table cellpadding="3" cellspacing="0">
                                        <tr th:if="${buildingName}">
                                            <td style="color: #999; padding-right: 12px; white-space: nowrap;">Πολυκατοικία</td>
                                            <td><strong th:text="${buildingName}">—</strong></td>
                                        </tr>
                                        <tr th:if="${managerName}">
                                            <td style="color: #999; padding-right: 12px; white-space: nowrap;">Διαχειριστής</td>
                                            <td th:text="${managerName}">—</td>
                                        </tr>
                                        <tr th:if="${buildingAddress}">
                                            <td style="color: #999; padding-right: 12px; white-space: nowrap;">Διεύθυνση</td>
                                            <td th:text="${buildingAddress}">—</td>
                                        </tr>
                                        <tr th:if="${apartmentLabel}">
                                            <td style="color: #999; padding-right: 12px; white-space: nowrap;">Το διαμέρισμά σας</td>
                                            <td th:text="${apartmentLabel}">—</td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>

                        <p style="font-size: 12px; color: #999; margin-top: 30px; line-height: 1.5;">
                            Αν έχεις ερωτήσεις, επικοινώνησε με τον διαχειριστή της πολυκατοικίας σου.
                        </p>

                        <p style="font-size: 14px; color: #999; margin-top: 30px; text-align: center;">
                            Η ομάδα του Oikio
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
