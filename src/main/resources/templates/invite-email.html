<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Πρόσκληση</title></head>
<body style="margin:0;padding:0;background-color:#f3f6f5;font-family:Arial,sans-serif;color:#203531;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f6f5;"><tr><td align="center" style="padding:24px 12px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background-color:#ffffff;">
<tr><td style="padding:24px 28px;background-color:#174d43;color:#ffffff;font-size:24px;font-weight:bold;">Oikio</td></tr>
<tr><td style="padding:32px 28px;font-size:16px;line-height:1.6;"><p style="margin:0 0 8px;color:#44766b;font-size:12px;font-weight:bold;">ΠΡΟΣΚΛΗΣΗ</p><h1 style="margin:0 0 20px;font-size:24px;line-height:1.3;">Έχεις μια πρόσκληση</h1>
<p>Γεια σου,</p><p>Ο χρήστης <strong th:text="${username}">Χρήστης</strong> σε προσκάλεσε να συμμετάσχεις<span th:if="${roleLabel != null}"> ως <strong th:text="${roleLabel}">ρόλος</strong></span>.</p>
<p th:if="${contextName != null}" style="padding:16px;background-color:#f3f6f5;"><strong th:text="${contextName}">Πλαίσιο</strong></p><p>Πάτησε το κουμπί για να αποδεχτείς την πρόσκληση:</p>
<p style="margin:28px 0;"><a th:href="${confirmationUrl}" style="display:inline-block;padding:13px 22px;background-color:#174d43;color:#ffffff;text-decoration:none;font-weight:bold;">Αποδοχή πρόσκλησης</a></p><p style="font-size:14px;color:#667d76;">Αν δεν περιμένεις αυτή την πρόσκληση, μπορείς να αγνοήσεις αυτό το email.</p>
</td></tr><tr><td style="padding:20px 28px;border-top:1px solid #e3ebe8;color:#6b807a;font-size:12px;">Η ομάδα του Oikio</td></tr></table></td></tr></table></body></html>
